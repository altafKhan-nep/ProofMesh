[package]
name = "proofmesh-gate"
version = "0.1.0"
description = "ProofMesh on-chain gate: mint/revoke/claim skill credentials at wallet+skill PDAs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "proofmesh_gate"

[dependencies]
# 0.30.x resolves the solana-program 1.17/1.18 dependency tree, which the
# legacy SBF toolchain (platform-tools v1.41 → rustc 1.75) can still parse.
# 0.31+ pulls solana-program 2.x (edition-2024 crates) → needs rustc ≥ 1.85.
anchor-lang = "0.30.1"
# Keep blake3 on digest 0.10 (edition 2021); solana-program's caret on "1.5"
# would otherwise balloon to blake3 1.8.x → digest 0.11 → edition-2024 crates.
blake3 = { version = "=1.7.0", features = ["traits-preview"] }
# Cap borsh's derive macros on a fall pre-edition-2024 toolchain too.
borsh = "=1.2.1"
# zeroize_derive 1.5.0 is edition 2024; keep the 1.4.x line (edition 2021).
# curve25519-dalek 3.2.1 (via solana-program 1.17) only permits zeroize <1.4.
zeroize = "=1.3.0"
zeroize_derive = "=1.4.2"
# jobserver 0.1.33+ started pulling getrandom 0.4 (edition 2024); 0.1.32 is clean.
jobserver = "=0.1.32"
getrandom = "=0.2.17"
# indexmap 2.14.x went edition 2024 AND 2.13.x raised MSRV past rustc 1.75; 2.11.4 is safe for both.
indexmap = "=2.11.4"
# heck 0.3.3 (case conversion) leaves unicode-segmentation unconstrained ("1");
# cargo then selects 1.13.x which raised MSRV to 1.85 > rustc 1.75.
unicode-segmentation = "=1.12.0"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true